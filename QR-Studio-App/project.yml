# Projet généré par XcodeGen : `xcodegen generate` recrée QRStudio.xcodeproj.
# XcodeGen n'est qu'un outil de génération ; l'app n'embarque aucune dépendance externe.
name: QRStudio
options:
  bundleIdPrefix: app.qrstudio
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 38NNMCM5TA
    CODE_SIGN_STYLE: Automatic

packages:
  QRCore:
    path: QRCore

targets:
  QRStudio:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: QRStudio
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcon.icon
      - path: Resources/AppIcon-Nuit.icon
      - path: Resources/AppIcon-Ocean.icon
      - path: Resources/AppIcon-Menthe.icon
      - path: Resources/AppIcon-Corail.icon
    dependencies:
      - package: QRCore
      - target: QRStudioShare
      - target: QRStudioAction
      - target: QRStudioWatch
      - target: QRStudioWidgets
    entitlements:
      path: QRStudio/QRStudio.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.qrstudio.shared
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.app.qrstudio]
        aps-environment: development
        com.apple.developer.networking.HotspotConfiguration: true
    info:
      path: QRStudio/Info.plist
      properties:
        CFBundleDisplayName: QR Studio
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.qrstudio.safebrowsing.refresh]
        SafeBrowsingAPIKey: $(SAFE_BROWSING_API_KEY)
        NSLocalNetworkUsageDescription: "Pour envoyer vos scans au Mac appairé sur le même réseau."
        NSBonjourServices: [_qrstudio._tcp]
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [comgooglemaps]
        CFBundleURLTypes:
          - CFBundleURLName: app.qrstudio
            CFBundleURLSchemes: [qrstudio]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.qrstudio.scan
            UIApplicationShortcutItemTitle: Scanner un code
            UIApplicationShortcutItemIconSymbolName: qrcode.viewfinder
          - UIApplicationShortcutItemType: app.qrstudio.create
            UIApplicationShortcutItemTitle: Créer un code
            UIApplicationShortcutItemIconSymbolName: plus.square.on.square
          - UIApplicationShortcutItemType: app.qrstudio.last
            UIApplicationShortcutItemTitle: Dernier scan
            UIApplicationShortcutItemIconSymbolName: clock.arrow.circlepath
        NSCameraUsageDescription: "La caméra sert uniquement à scanner les codes QR et les codes-barres. Aucune photo n’est prise."
        NSPhotoLibraryUsageDescription: "Pour choisir une image contenant un code à analyser."
        NSPhotoLibraryAddUsageDescription: "Pour enregistrer les codes que vous créez dans Photos."
        NSContactsUsageDescription: "Pour ajouter un contact scanné à vos contacts."
        NSCalendarsWriteOnlyAccessUsageDescription: "Pour ajouter un événement scanné à votre calendrier."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: "Pour enregistrer le lieu d’un scan, seulement si vous activez cette option."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrstudio
        PRODUCT_NAME: QRStudio
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Nuit AppIcon-Ocean AppIcon-Menthe AppIcon-Corail"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  QRStudioShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Shared
      - path: Extensions/Share
    dependencies:
      - package: QRCore
    entitlements:
      path: Extensions/Share/QRStudioShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.qrstudio.shared
    info:
      path: Extensions/Share/Info.plist
      properties:
        CFBundleDisplayName: QR Studio
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrstudio.share
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  QRStudioAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Shared
      - path: Extensions/Action
    dependencies:
      - package: QRCore
    entitlements:
      path: Extensions/Action/QRStudioAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.qrstudio.shared
    info:
      path: Extensions/Action/Info.plist
      properties:
        CFBundleDisplayName: Scanner avec QR Studio
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ActionViewController
          NSExtensionAttributes:
            NSExtensionServiceRoleType: NSExtensionServiceRoleTypeViewer
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrstudio.action
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  QRStudioMac:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: QRStudioMac
      - path: QRStudio/App/AppSettings.swift
      - path: QRStudio/App/AutoOpenMode.swift
      - path: QRStudio/App/BatchSymbologyPreset.swift
      - path: QRStudio/Shared/Platform.swift
      - path: QRStudio/Shared/Pasteboard.swift
      - path: QRStudio/Shared/Announcer.swift
      - path: QRStudio/Shared/FieldKeyboard.swift
      - path: QRStudio/Shared/FieldContent.swift
      - path: QRStudio/Shared/SheetHeight.swift
      - path: QRStudio/Shared/Pause.swift
      - path: QRStudio/Shared/TopBarModifier.swift
      - path: QRStudio/Generator/PinnedPreview.swift
      - path: QRStudio/Shared/AlertCenter.swift
      - path: QRStudio/Shared/AlertHost.swift
      - path: QRStudio/Shared/EntryStore.swift
      - path: QRStudio/Shared/ThumbnailCache.swift
      - path: QRStudio/Shared/CodeThumbnail.swift
      - path: QRStudio/Shared/CodePreview.swift
      - path: QRStudio/Shared/CodeEntry+Preview.swift
      - path: QRStudio/Shared/Glass.swift
      - path: QRStudio/Shared/GlassGroup.swift
      - path: QRStudio/Shared/SymbolNames.swift
      - path: QRStudio/Shared/OnDeviceIntelligence.swift
      - path: QRStudio/Shared/CodeLabelSuggestion.swift
      - path: QRStudio/Shared/SmartSearchCriteria.swift
      - path: QRStudio/Shared/LabelSuggestionRow.swift
      - path: QRStudio/Shared/SpotlightIndexer.swift
      - path: QRStudio/Shared/DraggableCode.swift
      - path: QRStudio/Shared/CSVImport.swift
      - path: QRStudio/Shared/TestDataSeeder.swift
      - path: QRStudio/Shared/DemoData.swift
      - path: QRStudio/Intents
        excludes:
          - VisualIntelligenceIntents.swift
          - ShowVisualSearchResultsIntent.swift
      - path: QRStudio/Generator/GeneratorFormModel.swift
      - path: QRStudio/Generator/Forms
      - path: QRStudio/Generator/ReadabilityIndicator.swift
      - path: QRStudio/Styling
      - path: QRStudio/History/HistoryFilter.swift
      - path: QRStudio/History/HistoryListModel.swift
      - path: QRStudio/History/HistoryRow.swift
      - path: QRStudio/History/FolderEditor.swift
      - path: QRStudio/History/FolderManagerView.swift
      - path: QRStudio/History/FolderPickerSheet.swift
      - path: QRStudio/History/HistoryFilterSheet.swift
      - path: QRStudio/History/OptionalDatePicker.swift
      - path: QRStudio/History/ScanMapView.swift
      - path: QRStudio/History/PlaceCodesSheet.swift
      - path: QRStudio/History/MapDateRangeSheet.swift
      - path: QRStudio/History/DetailEditor.swift
      - path: QRStudio/History/DetailMetadata.swift
      - path: QRStudio/Scanner/LabelField.swift
      - path: QRStudio/Actions/CopyableRow.swift
      - path: QRStudio/Actions/CardSection.swift
      - path: QRStudio/Actions/ContentDetailCard.swift
      - path: QRStudio/Actions/URLDetailCard.swift
      - path: QRStudio/Actions/LinkPreviewRow.swift
      - path: QRStudio/Actions/LocationDetailCard.swift
      - path: QRStudio/Actions/EventDetailCard.swift
      - path: QRStudio/Actions/ProductDetailCard.swift
      - path: QRStudio/Actions/OpenFoodFactsClient.swift
      - path: QRStudio/Actions/ContentActionsView.swift
      - path: QRStudio/Actions/TranslationSheet.swift
      - path: QRStudio/Settings/SyncSection.swift
      - path: QRStudio/Settings/BackupSection.swift
      - path: QRStudio/Settings/BackupFile.swift
      - path: QRStudio/Settings/SecurityScoped.swift
      - path: QRStudio/Settings/DangerZoneSection.swift
      - path: QRStudio/Settings/SearchSitesView.swift
      - path: QRStudio/Settings/SearchSiteEditor.swift
      - path: QRStudio/Settings/PrivacyPolicyView.swift
      - path: Extensions/Shared/NSItemProvider+Data.swift
      - path: Resources/Localizable.xcstrings
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcon.icon
    dependencies:
      - package: QRCore
    entitlements:
      path: QRStudioMac/QRStudioMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.app.qrstudio.shared
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.app.qrstudio]
        com.apple.developer.aps-environment: development
    info:
      path: QRStudioMac/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: QR Studio
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        LSApplicationCategoryType: public.app-category.utilities
        NSCameraUsageDescription: "La caméra sert uniquement à scanner les codes QR et les codes-barres. Aucune photo n’est prise."
        NSHumanReadableCopyright: "QR Studio — gratuit, sans publicité ni collecte de données."
        NSLocalNetworkUsageDescription: "Pour recevoir les scans de votre iPhone appairé sur le même réseau."
        SafeBrowsingAPIKey: $(SAFE_BROWSING_API_KEY)
        NSCameraUseContinuityCameraDeviceType: true
        NSBonjourServices: [_qrstudio._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrstudio
        PRODUCT_NAME: QR Studio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  QRStudioWatch:
    type: application
    platform: watchOS
    sources:
      - path: QRStudioWatch
      - path: Resources/Localizable.xcstrings
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcon.icon
    dependencies:
      - package: QRCore
      - target: QRStudioWatchWidgets
    entitlements:
      path: QRStudioWatch/QRStudioWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.qrstudio.shared
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.app.qrstudio]
        aps-environment: development
    info:
      path: QRStudioWatch/Info.plist
      properties:
        CFBundleDisplayName: QR Studio
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: app.qrstudio
        CFBundleURLTypes:
          - CFBundleURLName: app.qrstudio.watch
            CFBundleURLSchemes: [qrstudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrstudio.watchkitapp
        PRODUCT_NAME: QRStudioWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  QRStudioWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: QRStudioWatchWidgets
    dependencies:
      - package: QRCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: QRStudioWatchWidgets/QRStudioWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.qrstudio.shared
    info:
      path: QRStudioWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: QR Studio
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrstudio.watchkitapp.widgets
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  QRStudioWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: QRStudioWidgets
      - path: Resources/Assets.xcassets
    dependencies:
      - package: QRCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: QRStudioWidgets/QRStudioWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.qrstudio.shared
    info:
      path: QRStudioWidgets/Info.plist
      properties:
        CFBundleDisplayName: QR Studio
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrstudio.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES

  QRStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QRStudioTests
    dependencies:
      - target: QRStudio
      - package: QRCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.qrstudio.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  QRStudioWatch:
    build:
      targets:
        QRStudioWatch: all
  QRStudioMac:
    build:
      targets:
        QRStudioMac: all
    run:
      config: Debug
  QRStudio:
    build:
      targets:
        QRStudio: all
    test:
      targets:
        - QRStudioTests
        - package: QRCore/QRCoreTests
    run:
      config: Debug
